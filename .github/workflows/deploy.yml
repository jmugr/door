name: Deploy Quartz site to GitHub Pages
 
on:
  push:
    branches:
      - v4
  workflow_dispatch:
  repository_dispatch:
    types: [vault-updated]
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: "pages"
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout Vault Repository
        uses: actions/checkout@v4
        with:
          repository: jmugr/vault
          token: ${{ secrets.GH_TOKEN }}
          path: vault
          fetch-depth: 0  # Need full git history for changelog
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python Dependencies
        run: |
          pip install -r scripts/requirements.txt
      - name: Setup Firebase Credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" | base64 --decode > scripts/serviceAccountKey.json
      - name: Generate Changelog
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: |
          python scripts/create-changelog.py --vault-path=vault
      - name: Commit and Push Changelog
        working-directory: vault
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add "Garage changelog.md"
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update changelog [skip ci]" && git push)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build --directory=vault
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
 
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4